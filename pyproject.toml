[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gjb438c-docx-style-skill"
version = "0.3.0"
description = "Codex skill for GJB 438C SRS authoring, source traceability, and layered DOCX audit."
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.2",
  "PyYAML>=6.0.1",
  "jsonschema>=4.18,<5",
]

[tool.setuptools]
py-modules = []
